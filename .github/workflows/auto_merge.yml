name: Auto Merge and Sort

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge PR and Sort index.html
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number provided (workflow_dispatch run)."
            exit 0
          fi

          git fetch origin pull/${PR_NUMBER}/head:pr-${PR_NUMBER}

          python3 -c '
          import subprocess, re, os

          pr_number = os.environ["PR_NUMBER"]
          pr_user = os.environ["PR_USER"]
          pr_ref = os.environ["PR_REF"]

          def parse_names(text):
              names = []
              for line in text.splitlines():
                  line = line.strip()
                  m = re.search(r"<h1>\s*(.*?)\s*<", line, re.I)
                  if m and m.group(1).strip():
                      name = m.group(1).strip().upper()
                      if name != "HELLO WORLD":
                          names.append(name)
              return names

          with open("index.html", "r", encoding="utf-8") as f:
              curr_names = parse_names(f.read())

          pr_names = []
          try:
              pr_text = subprocess.check_output(["git", "show", f"pr-{pr_number}:index.html"]).decode("utf-8", errors="ignore")
              pr_names = parse_names(pr_text)
          except Exception as e:
              print(f"No index.html in PR head: {e}")

          all_names = list(curr_names)
          for name in pr_names:
              if name not in all_names:
                  all_names.append(name)

          all_names.sort()

          lines = [f"    <h1>{name}</h1>" for name in all_names]
          html = "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Hello World</title>\n</head>\n\n<body>\n" + "\n".join(lines) + "\n</body>\n\n</html>\n"

          msg = f"Merge pull request #{pr_number} from {pr_user}/{pr_ref}"
          subprocess.run(["git", "merge", "--no-ff", f"pr-{pr_number}", "-m", msg], capture_output=True)

          if os.path.exists("menambahkan nama lengkap saya"):
              subprocess.run(["git", "rm", "-f", "menambahkan nama lengkap saya"], capture_output=True)

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)

          subprocess.run(["git", "add", "index.html"], check=True)

          if os.path.exists(".git/MERGE_HEAD"):
              subprocess.run(["git", "commit", "-m", msg], check=True)
          else:
              diff = subprocess.run(["git", "diff", "--staged", "--quiet"])
              if diff.returncode != 0:
                  subprocess.run(["git", "commit", "--amend", "--no-edit"], check=True)
          '

          git push origin main
